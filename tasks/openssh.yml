# Configure OpenSSH Server with either standard or hardened configs

- name: Configure OpenSSH with the Standard configuration
  ansible.builtin.template:
    src: 'sshd_standard.j2'
    dest: '/etc/ssh/sshd_config'
    owner: root
    group: root
    mode: "0644"
    validate: '/usr/sbin/sshd -t -f %s'
  when: ssh_config.configuration != "Hardened"
  notify: Restart ssh

- name: Configure OpenSSH with the Hardened configuration
  ansible.builtin.template:
    src: 'sshd_hardened.j2'
    dest: '/etc/ssh/sshd_config'
    owner: root
    group: root
    mode: "0644"
    validate: '/usr/sbin/sshd -t -f %s'
  when: ssh_config.configuration == "Hardened"
  notify: Restart ssh
